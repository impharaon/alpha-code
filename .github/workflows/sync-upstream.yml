# alpha-code auto-sync — CANDIDATE phase (untrusted, read-only, no push credentials).
#
# alpha only ADDS files, so the ONLY expected merge conflict is `bun.lock`
# (adding workspace packages necessarily updates it). That case is auto-resolved
# by taking upstream's lockfile and re-running `bun install`. `#1664`: the root
# `CHANGELOG.md` is the second expected conflict — upstream ships OpenCode 2's
# release notes at that path, Code Puppy keeps its own release history there, so
# it is always resolved to ours.
#
# `#1566`: the exception is the takeover list — upstream files alpha deliberately
# edits, registered once in `scripts/north-star-guard.sh` (`UPSTREAM_EXCLUDES`).
# `Takeover intake check` reads that list from the pre-merge alpha tree and, when
# the upstream candidate touches any of those paths, fails BEFORE merging (no
# bundle) and reports each path for a human upgrade review; the reviewed port
# lands as a real merge commit (second parent = the reviewed `dev` SHA, never
# squash/rebase — docs/runbooks/ci.md §4), which moves the merge-base so the
# next run no longer sees the same paths. After the merge, `Takeover paths
# unchanged by merge` asserts no listed path changed. Any other conflict is an
# unregistered deviation (ADR-029: register or revert) — the job fails loudly.
#
# `#899`(SEC): this job used to also hold `contents: write` + a repo-push token in
# `.git/config` for its whole duration WHILE running code fetched from the untrusted
# upstream tree (`bun install` lifecycle scripts, then booting the merged engine for
# the smoke test). A compromised upstream commit could read that credential out of
# `.git/config` and push/exfiltrate with it. This job now has NO push credential at
# all — `permissions: contents: read`, no `secrets.SYNC_TOKEN` reference anywhere in
# this file, and every `actions/checkout` carries `persist-credentials: false`. It
# does the merge, runs every guard/tripwire and the engine smoke test, and — only if
# all of that succeeds — packages the resulting `dev`/`alpha` commits into an
# immutable git-bundle artifact. It never pushes anything itself.
#
# The privileged half lives in `sync-upstream-push.yml`: a separate workflow, with
# `contents: write` and the short-lived push token, triggered by `workflow_run` only
# after this job reports `success` (i.e. only after every guard/smoke step passed).
# It downloads the bundle this job produced, verifies it, and pushes the exact
# commits validated here — it never executes any code from the merged tree, so the
# push credential is never in the same process as untrusted code.
name: sync-upstream

on:
  # 定时同步(2026-07-21 重开):日常 sync 只进引擎。`#1668` 起冻结前端住在 packages/codepuppy-{app,ui}
  # (pin + SOT 补丁,见 frontend/README.md),上游 packages/{app,ui} 原样跟着上游走,sync 不再还原前端。
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

# `#899`(SEC):只读。这个 job 全程不持有任何推送凭据——不要在这个文件里加 `contents: write`
# 或引用 `secrets.SYNC_TOKEN`。推送凭据只属于 sync-upstream-push.yml。
permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    # 冲突路径的 `bun install` 会跑 husky prepare 重挂钩子,随后 commit/push 被上游全量
    # turbo typecheck pre-push 挡死(冻结世界恒红,ADR-020 已知偏斜;2026-07-04~06
    # 连败三天即此)。权威门是 PR 的 codepuppy-ci,sync 机器人不走 husky 门。
    env:
      HUSKY: "0"
    steps:
      - name: Checkout (full history, no push credential)
        uses: actions/checkout@v4
        with:
          ref: alpha
          fetch-depth: 0
          persist-credentials: false

      # `#1664`:OpenCode 2 的根 package.json 写的是 bun@1.4.4,引擎冒烟跑的是 2.x 的 CLI。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Configure git + remotes
        run: |
          git config user.name "codepuppy-bot"
          git config user.email "actions@users.noreply.github.com"
          # jinjunnn/alpha-code and anomalyco/opencode are both public — plain
          # anonymous HTTPS fetch works, no credential of any kind is needed here.
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --no-tags upstream dev
          git fetch --no-tags origin dev
          # Captured before anything else touches the tree — this is the base the
          # push workflow diffs its post-drift sanity check against.
          echo "OLD_ALPHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fast-forward `dev` mirror from upstream (local only, no push)
        run: |
          old_dev="$(git rev-parse origin/dev)"
          git checkout -B dev origin/dev
          git merge --ff-only upstream/dev
          # SHAs are our own rev-parse output (not untrusted input) — safe to pass via env.
          echo "OLD_DEV=$old_dev" >> "$GITHUB_ENV"
          echo "NEW_DEV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ADR-015 合并验证:Tier-3 行为层(codepuppy-behavior/identity/.opencode/agent)与上游 prompt 底座的
      # 矛盾不产生 git 冲突 → file-diff 守卫(ADR-004)测不出。当本次 sync 触碰上游 prompt/*.txt 或
      # agent/* 时,发一条 warning + step summary 要求人工语义复核(不阻断同步)。
      # `#1664`:OpenCode 2 的系统提示与 agent 定义在 core 里(基线 §2.9;清点表 L3r)。
      - name: Prompt/agent tripwire (ADR-015 — human review required)
        run: |
          paths="packages/core/src/session/system-prompt.ts packages/core/src/plugin/system-prompt packages/core/src/agent.ts"
          touched="$(git diff --name-only "$OLD_DEV".."$NEW_DEV" -- $paths || true)"
          if [ -n "$touched" ]; then
            {
              echo "## ⚠️ 上游 prompt 底座 / agent 本次 sync 有变更"
              echo ""
              echo "ADR-015 合并验证:人工复核 \`codepuppy-behavior.ts\` / \`codepuppy-identity.ts\` / \`.opencode/agent/*.md\` 是否与新底座**语义**矛盾(非字节),结论记入 \`docs/retrospectives/\`。"
              echo ""
              echo '```'
              echo "$touched"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=ADR-015 prompt tripwire::upstream prompt/agent base changed — review alpha behavior/identity layers for semantic conflicts"
          else
            echo "No upstream prompt/agent base changes this sync."
          fi

      # `#1566`(I11):接管清单只有一份 —— scripts/north-star-guard.sh 的 UPSTREAM_EXCLUDES。
      # 这一步从**合并前的可信树**(`$OLD_ALPHA`)取守卫脚本、只跑它的只读模式 `--print-takeover`;
      # 此刻工作树是上游 `dev`(上一步 checkout 的),所以**不许**执行工作树里的任何脚本(`#899`)。
      # 本文件里不写任何字面接管路径。上游候选(merge-base..NEW_DEV)触及清单 ⇒ 不合并、不出 bundle,
      # 把每条路径的上游提交与双方差异写进运行摘要与产物,以「需要升级审查」失败。
      # 行为闸:packages/ui-mac/src/main/sync-upstream-takeover-isolation.test.ts。
      - name: Takeover intake check
        id: takeover
        run: |
          guard="$(mktemp)"
          git show "$OLD_ALPHA:scripts/north-star-guard.sh" > "$guard"
          # #1662 F10:清单可以合法为空(换代后的接管面可能收到零),这与「守卫没跑出结果」是两件事 ——
          # 先读守卫自报的条数,读不出 ⇒ 守卫坏了,中止;条数为 0 ⇒ 没有接管文件要核对,照常继续。
          jurisdiction="$(bash "$guard" --print-jurisdiction)"
          count="$(awk -F'\t' '$1 == "UPSTREAM_EXCLUDES_COUNT" { print $2 }' <<< "$jurisdiction")"
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::守卫没有给出接管清单条数 —— $OLD_ALPHA 的 scripts/north-star-guard.sh --print-jurisdiction 读不出 UPSTREAM_EXCLUDES_COUNT,无法判断上游候选是否触及接管文件。Aborting sync."
              exit 1 ;;
          esac
          takeover="$(bash "$guard" --print-takeover)"
          paths=()
          while IFS= read -r p; do [ -n "$p" ] && paths+=("$p"); done <<< "$takeover"
          if [ "${#paths[@]}" -ne "$count" ]; then
            echo "::error::守卫打印的接管路径(${#paths[@]} 条)与它自报的条数($count)不一致。Aborting sync."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "Takeover list is empty (UPSTREAM_EXCLUDES_COUNT=0): no takeover paths to check."
            exit 0
          fi
          MB="$(git merge-base "$OLD_ALPHA" "$NEW_DEV")"
          touched="$(git diff --name-only --no-renames "$MB" "$NEW_DEV" -- "${paths[@]}")"
          if [ -z "$touched" ]; then
            echo "Upstream candidate $MB..$NEW_DEV touches none of the ${#paths[@]} takeover paths."
            exit 0
          fi
          review="$RUNNER_TEMP/takeover-review"
          mkdir -p "$review"
          report="$review/report.md"
          {
            echo "## 需要升级审查:上游候选触及接管文件(\`#1566\`)"
            echo ""
            echo "上游候选 \`$MB..$NEW_DEV\` 改了下面这些我们已接管的文件(清单:\`$OLD_ALPHA:scripts/north-star-guard.sh\` 的 \`UPSTREAM_EXCLUDES\`)。本次**没有合并、没有产出推送包**。"
            echo ""
            echo "处置:人工把上游改动移植进我方版本,落在一个**真合并提交**上(第二父 = \`$NEW_DEV\`),该 PR 用 \`gh pr merge --merge\` 合入,**禁止 squash / rebase**(docs/runbooks/ci.md §4)。这样 merge-base 前移,下一次同步不再命中这一批路径。"
            echo ""
            while IFS= read -r p; do
              echo "### \`$p\`"
              echo ""
              echo "相关上游提交:"
              echo ""
              git log --format='- `%h` %s' "$MB..$NEW_DEV" -- "$p"
              echo ""
              echo "上游差异(\`$MB..$NEW_DEV\`):"
              echo ""
              echo '```diff'
              git diff --no-renames "$MB" "$NEW_DEV" -- "$p"
              echo '```'
              echo ""
              echo "我方差异(\`$MB..$OLD_ALPHA\`):"
              echo ""
              echo '```diff'
              git diff --no-renames "$MB" "$OLD_ALPHA" -- "$p"
              echo '```'
              echo ""
            done <<< "$touched"
          } > "$report"
          # 运行摘要单步上限 1 MiB;超出时截断,完整报告在产物 takeover-review 里。
          head -c 900000 "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(wc -c < "$report")" -gt 900000 ]; then
            printf '\n\n…(摘要已截断,完整报告见本次 run 的产物 `takeover-review`)\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "review=true" >> "$GITHUB_OUTPUT"
          echo "::error title=takeover upgrade review required::需要升级审查:上游候选触及 $(printf '%s\n' "$touched" | wc -l | tr -d ' ') 条接管路径,未合并、未产出推送包 —— 逐条路径、上游提交与双方差异见运行摘要与产物 takeover-review:"
          echo "$touched"
          exit 1

      - name: Upload takeover review report
        if: failure() && steps.takeover.outputs.review == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: takeover-review
          path: ${{ runner.temp }}/takeover-review/
          retention-days: 14
          if-no-files-found: error

      - name: Merge `dev` into `alpha` (local only, no push)
        run: |
          git checkout alpha
          # `#1668`:冻结前端搬到 packages/codepuppy-{app,ui}(上游没有这两条路径),packages/{app,ui} 是上游原样、
          # Code Puppy 不用 —— 原来合并后把它们还原成 pin + 补丁的 `apply_codepuppy_frontend_delta` 已删。
          # 那两个目录上的冲突不再是「预期冲突」:alpha 不改它们,冲突即未登记的偏离(下面的 else 分支)。
          if git merge --no-edit --no-ff dev -m "chore(sync): merge upstream dev into alpha"; then
            exit 0
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(echo "$conflicts" | grep -v '^bun.lock$' | grep -v '^CHANGELOG.md$' || true)"
          if [ -z "$unexpected" ]; then
            if echo "$conflicts" | grep -q '^bun.lock$'; then
              echo "Resolving expected bun.lock conflict by regenerating the lockfile."
              git checkout --theirs -- bun.lock
            fi
            # `#1664`(编排器裁决,#1664 评论 6734550342):根 CHANGELOG.md 是 Code Puppy 的用户可见发布历史,
            # 上游同一路径是 OpenCode 2 的发布说明 —— 两份不相干的文档,一律取我方。
            if echo "$conflicts" | grep -q '^CHANGELOG.md$'; then
              echo "Resolving expected CHANGELOG.md conflict: keeping Code Puppy's release history."
              git checkout --ours -- CHANGELOG.md
            fi
            # 结束合并之后才 install:lockfile 要照着最终这棵树生成。
            # 行为闸:packages/ui-mac/src/main/sync-upstream-merge-order.test.ts —— 它从本文件解析出
            # 这一步的 run 体、在真 git 仓上跑它本体。
            git add -A
            git commit --no-edit
            bun install
            # 上面 `--theirs` 取的是上游的 bun.lock,它不含 alpha 的 workspace 包 —— 只有结束合并之后
            # 的这次 install 才按最终这棵树重生它。变了就单独落一个提交,否则这次 sync
            # 会把一份对不上的 lockfile 推上 alpha。
            if ! git diff --quiet -- bun.lock; then
              git add bun.lock
              git commit -m "chore(sync): regenerate bun.lock after conflict resolution"
            fi
          else
            # `#1566`:走到这里时 Takeover intake check 已证明上游候选没碰接管清单,所以剩下的冲突
            # 路径既不是干净上游、也不是登记过的接管 —— 是未登记的偏离。
            echo "::error title=unregistered deviation::未登记的偏离:按 ADR-029 登记或还原 —— 下列冲突路径不在接管清单(scripts/north-star-guard.sh UPSTREAM_EXCLUDES)里,alpha 却改过它们:"
            echo "$unexpected"
            git merge --abort
            exit 1
          fi

      # `#1566`(I11)合并后第二次核对:接管路径相对合并前(`$OLD_ALPHA`)必须一个字节都没变。
      # 清单与上一次核对同源:从合并前的可信树取守卫脚本跑 `--print-takeover`,不读合并后的树。
      - name: Takeover paths unchanged by merge
        run: |
          guard="$(mktemp)"
          git show "$OLD_ALPHA:scripts/north-star-guard.sh" > "$guard"
          # #1662 F10:同 intake —— 条数读不出 ⇒ 中止;条数为 0 ⇒ 无可核对,照常继续。
          jurisdiction="$(bash "$guard" --print-jurisdiction)"
          count="$(awk -F'\t' '$1 == "UPSTREAM_EXCLUDES_COUNT" { print $2 }' <<< "$jurisdiction")"
          case "$count" in
            ''|*[!0-9]*)
              echo "::error::守卫没有给出接管清单条数 —— 无法核对合并是否改动了接管路径。Aborting sync."
              exit 1 ;;
          esac
          takeover="$(bash "$guard" --print-takeover)"
          paths=()
          while IFS= read -r p; do [ -n "$p" ] && paths+=("$p"); done <<< "$takeover"
          if [ "${#paths[@]}" -ne "$count" ]; then
            echo "::error::守卫打印的接管路径(${#paths[@]} 条)与它自报的条数($count)不一致。Aborting sync."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "Takeover list is empty (UPSTREAM_EXCLUDES_COUNT=0): nothing the merge could have changed."
            exit 0
          fi
          changed="$(git diff --name-only --no-renames "$OLD_ALPHA" alpha -- "${paths[@]}")"
          if [ -n "$changed" ]; then
            echo "::error title=takeover changed by merge::合并改动了接管路径(相对合并前 $OLD_ALPHA)—— 接管内容不许被自动改写。Aborting sync:"
            echo "$changed"
            exit 1
          fi
          echo "Merge left all ${#paths[@]} takeover paths unchanged."

      # REQ-012 前端锚点 tripwire(镜像上面的 ADR-015 prompt tripwire):reskin 挂的上游 data-* 锚点
      # 是非公开契约,sync 改名/删除不产生 git 冲突 → file-diff 守卫测不出(546-sync 静默回归实锤,
      # 见 docs/audits/2026-07-03-frontend-reskin-regression.md)。合并后跑锚点契约测试(纯 node 内建,
      # 无需 install);断裂 → warning + step summary 要求人工视觉复验(不阻断同步——PR 门禁 codepuppy-ci
      # 与发布 runbook 是硬闸)。
      - name: Frontend anchor tripwire (REQ-012 — human visual review required)
        run: |
          if (cd packages/ui-mac && bun test src/renderer/codepuppy-ui/upstream-anchors.test.ts) > /tmp/anchor-test.log 2>&1; then
            echo "Anchor contract intact this sync."
          else
            {
              echo "## ⚠️ 上游 sync 破坏了前端 reskin 锚点契约(REQ-012)"
              echo ""
              echo "锚点契约测试失败——上游改名/删除/搬包了 reskin 依赖的 data-* 锚点。**发布前必须**:"
              echo "1. \`cd packages/ui-mac && bun test src/renderer/codepuppy-ui/upstream-anchors.test.ts\` 看断点;"
              echo "2. 更新 reskin CSS / 跑 \`bun scripts/gen-upstream-anchors.ts\` 刷新清单;"
              echo "3. CDP 截图关键屏(首页/会话/模型卡/composer/时间线)视觉复验([[visual-verify-required]])。"
              echo ""
              echo '```'
              tail -40 /tmp/anchor-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=REQ-012 anchor tripwire::upstream sync broke reskin anchor contract — visual re-verify required before any release"
          fi

      # S39 复盘病灶 2(2026-07-12):ADR-020 预警过「冻结前端 ↔ 新引擎的运行时契约漂移,
      # typecheck 测不全,真机冒烟兜底」——此前冒烟从未机械化,sync 后引擎行为变化只能等真机撞见
      # (REQ-083 复验实锤:同一验收脚本 7-10 绿、合 sync 后 stage5 僵死)。本步无头启动合并后的
      # 引擎 → 打关键端点 → 硬杀 → 同端口重启 → 再打(respawn 族覆盖)。任一步失败 → 本 job 红,
      # 不产出下面的 sync 产物 artifact,推送阶段永远不会看到这次改动(`#899`:smoke 通过之前
      # 这个 job 连推送凭据都没有,失败即天然阻断推送,不需要额外的"先推后报警")。
      - name: Engine runtime smoke (S39 — boot/probe/kill/reboot)
        run: |
          bun install
          bash scripts/engine-smoke.sh

      # `#899`(SEC):产出**不可变**的推送候选——把这次 sync 验证过的 `dev`/`alpha` 提交打包成
      # git bundle。推送阶段只会解包并推送这些确切的 commit object,不会重新执行任何合并/安装/
      # 冒烟逻辑(那些只发生在本 job、本 job 从不持有推送凭据)。范围严格限定在这次 sync 新增的
      # 提交(排除 sync 开始前 origin 已有的历史),避免把整个 opencode 历史打进 artifact。
      - name: Build sync bundle artifact
        id: bundle
        run: |
          NEW_ALPHA="$(git rev-parse alpha)"
          if [ "$OLD_DEV" = "$NEW_DEV" ] && [ "$OLD_ALPHA" = "$NEW_ALPHA" ]; then
            echo "Nothing to sync this run — dev and alpha are unchanged. Skipping bundle/push." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p sync-artifact
          git bundle create sync-artifact/sync.bundle \
            "$OLD_DEV..refs/heads/dev" "$OLD_ALPHA..refs/heads/alpha"
          {
            echo "old_dev=$OLD_DEV"
            echo "new_dev=$NEW_DEV"
            echo "old_alpha=$OLD_ALPHA"
            echo "new_alpha=$NEW_ALPHA"
          } > sync-artifact/manifest.env
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## sync-upstream candidate ready to push"
            echo ""
            echo "| ref | before | after |"
            echo "|---|---|---|"
            echo "| dev | \`$OLD_DEV\` | \`$NEW_DEV\` |"
            echo "| alpha | \`$OLD_ALPHA\` | \`$NEW_ALPHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync bundle
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sync-bundle
          path: sync-artifact/
          retention-days: 1
          if-no-files-found: error
