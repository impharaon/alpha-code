<style>
  /* 组合规则(只排版,无新组件、无新令牌):
     ① Toast 视口在应用里 fixed 在窗口右下 16px,画框里改成相对窗口定位;画框不播入场动画(同 direction.css 对 .a-pop 的处理);
     ② Tooltip 在应用里 Portal 到 body,默认放在触发按钮上方 6px、水平居中(Tooltip.tsx 的 top 放置),画框里静态摆位;
     ③ 两列网格与代码一致用 minmax(0, 1fr)(extension-hub.css .codepuppy-ext-grid),长名称不撑宽列。 */
  .fr .a-toast-viewport { position: absolute; right: 16px; bottom: 16px; }
  .fr .a-toast { animation: none; }
  .fr .tip-at { top: auto; bottom: calc(100% + 6px); left: 50%; translate: -50% 0; }
  .fr .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const q = new URLSearchParams(location.search)
    const small = q.get("size") === "1280"
    const dark = q.get("theme") === "dark"
    document.body.classList.toggle("is-1280", small)
    document.querySelectorAll(".fr").forEach((f) => f.classList.toggle("is-dark", dark))
    document.querySelectorAll("[data-size]").forEach((a) => a.toggleAttribute("data-on", (a.dataset.size === "1280") === small))
  })
</script>
