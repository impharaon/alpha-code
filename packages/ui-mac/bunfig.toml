# Bun 1.4.4: tsconfig `"jsx": "preserve"` + `jsxImportSource: "solid-js"` now compiles to the automatic
# runtime (`jsxDEV` from solid-js/jsx-dev-runtime), and solid-js exports no runtime there -> every test that
# merely imports a .tsx module dies at link time. Bun 1.3.x compiled the same tsconfig to classic
# `React.createElement`, which links fine and is never executed in-process. This restores that.
# Not upstream's `../ui/test/solid-jsx.ts` preload: a preload onLoad plugin outranks the babel-preset-solid
# plugin the test-component/*.cases.ts subprocesses register, so it would replace the production compiler
# there (measured: catalog-failure-banner / attachment-cards go red). Real rendering stays with those cases.
# Top-level on purpose: under [test] Bun ignores it (measured).
jsx = "react"

[test]
# Pin the UI locale to zh before any test file evaluates. The real-Solid-render suites
# (PermissionDialog / Recovery / settings) and the model-picker cases assert zh product
# copy, but happy-dom's navigator makes detectLocale() fall to "en" (#475 externalised
# the strings to t(...)). Setting the env here — one producer — is consumed by the single
# detectLocale() override, covering both the inlined per-bundle i18n instances and the
# subprocess in codepuppy-composer-model.component.test.ts (it inherits process.env).
preload = ["./scripts/test-preload.ts"]

# alpha-code#1558:选择器 / 输入框的品牌图标经上游 ProviderIcon 引用 `provider-icons/sprite.svg`。生产构建(vite)把
# `import sprite from "*.svg"` 解析成资源 URL;bun 没有 .svg 的默认 loader,会把它当 JSX 解析而整份组件套件挂掉。
# `file` = 与 vite 同义:默认导出是该资源的路径字符串。
[loader]
".svg" = "file"
